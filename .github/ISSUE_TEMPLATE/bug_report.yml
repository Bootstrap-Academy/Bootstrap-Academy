name: Bug Report
description: Report a problem with Bootstrap Academy
labels: ["bug"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report! English and German are both welcome.

        This report is public. Leave out personal details and hide private information in screenshots.
        We use your feedback to improve the platform. For a personal reply, contact us by [email](https://bootstrap.academy/docs/imprint).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What were you trying to do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: How can we try it ourselves? Leave this blank if you are unsure.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: false
  - type: dropdown
    id: browsers
    attributes:
      label: Browser (optional)
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
    validations:
      required: false
